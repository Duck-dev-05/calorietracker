name: CalorieTracker
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: '15.0'
targets:
  CalorieTracker:
    type: application
    platform: iOS
    sources: [CalorieTracker]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.CalorieTracker
        SWIFT_VERSION: '5.0'
        MARKETING_VERSION: '0.5.0'
        CURRENT_PROJECT_VERSION: '6'
        INFOPLIST_KEY_CFBundleDisplayName: Nourish
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: Import your height, weight, steps and active energy to personalize your daily overview.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Health access is optional. Your food diary is stored locally in this app.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    entitlements:
      path: CalorieTracker/CalorieTracker.entitlements
      properties:
        com.apple.developer.healthkit: true
