name: CalorieTracker
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: '15.0'
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 10.0.0
targets:
  CalorieTracker:
    type: application
    platform: iOS
    sources: [CalorieTracker]
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.CalorieTracker
        SWIFT_VERSION: '5.0'
        MARKETING_VERSION: '0.18.2'
        CURRENT_PROJECT_VERSION: '31'
        INFOPLIST_KEY_CFBundleDisplayName: Nourish
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/GoogleInfo.generated.plist
        INFOPLIST_KEY_NSHealthShareUsageDescription: Show your activity, workouts, body measurements, heart and respiratory readings, sleep, mindfulness and nutrition after you choose Health access.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Save height or weight measurements to Apple Health only after you review and confirm sharing.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    entitlements:
      path: CalorieTracker/CalorieTracker.entitlements
      properties:
        application-identifier: TROLLTROLL.com.personal.CalorieTracker
        com.apple.developer.team-identifier: TROLLTROLL
        keychain-access-groups:
          - TROLLTROLL.com.personal.CalorieTracker
        com.apple.developer.healthkit: true
