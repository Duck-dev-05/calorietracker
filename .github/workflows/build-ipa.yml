name: Build TrollStore IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 for native iOS 26 appearance
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install build tools
        run: brew install xcodegen ldid
      - name: Test storage and recovery behavior
        run: swift test
      - name: Compile and package iOS 15 IPA
        run: bash scripts/build-trollstore.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nourish-TrollStore-iOS15
          path: dist/Nourish.ipa
          if-no-files-found: error
          retention-days: 14
