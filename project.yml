name: CalorieTracker
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: '15.0'
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 10.0.0
targets:
  CalorieTracker:
    type: application
    platform: iOS
    sources: [CalorieTracker]
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.CalorieTracker
        SWIFT_VERSION: '5.0'
        MARKETING_VERSION: '0.10.0'
        CURRENT_PROJECT_VERSION: '14'
        INFOPLIST_KEY_CFBundleDisplayName: Nourish
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/GoogleInfo.generated.plist
        INFOPLIST_KEY_NSHealthShareUsageDescription: Import your height, weight, steps and active energy to personalize your daily overview.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Health access is optional. Your food diary is stored locally in this app.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    entitlements:
      path: CalorieTracker/CalorieTracker.entitlements
      properties:
        com.apple.developer.healthkit: true
